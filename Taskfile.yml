version: '3'

# Developer tooling for this repo. End users do not need Task — they install the
# module with lola directly, as the README documents. Task's job here is
# authoring and verification: lint, test, and prove the module installs.

vars:
  MODULE: docs-discipline
  MODE: '{{.MODE | default "human"}}'
  SCRIPTS_DIR: module/skills/docs-organization/scripts
  # npm toolchain for `task vendor` only; kept outside module/ so it never ships.
  TOOLCHAIN_DIR: .taskfiles/vendor
  CONTAINER_ENGINE:
    sh: command -v podman >/dev/null 2>&1 && echo podman || { command -v docker >/dev/null 2>&1 && echo docker || echo ""; }
  IMAGE: docs-discipline-cleanroom

tasks:
  default:
    silent: true
    cmd: task --list

  vendor:
    desc: Rebuild the vendored dependency bundles the skill ships (needs network for npm install and fetching Linguist data)
    cmds:
      - cd {{.TOOLCHAIN_DIR}} && npm install
      - bash "{{.ROOT_DIR}}/.taskfiles/scripts/build-vendor.sh"

  deps:bump:
    desc: Bump every npm toolchain pin (majors included) and the Linguist data pin to latest, then rebuild vendor/. Review the diff and run `task check` before committing.
    cmds:
      # The package list comes from package.json, so a new dependency needs no
      # edit here. --package-lock=true overrides a user npmrc that disables it.
      - cd {{.TOOLCHAIN_DIR}} && npm install --save-exact --package-lock=true $(node -p "Object.keys(require('./package.json').devDependencies).map((p) => p + '@latest').join(' ')")
      - node .taskfiles/scripts/bump-linguist-pin.mjs
      - task: vendor

  lint:
    desc: 'Structural lint of the module. MODE=llm for errors-only.'
    cmd: bash "{{.ROOT_DIR}}/.taskfiles/scripts/lint-structure.sh" --module . --mode {{.MODE}}

  lint:content:
    desc: 'Content-quality lint with skillsaw (needs uvx). MODE=llm for errors-only.'
    cmds:
      - |
        if ! command -v uvx >/dev/null 2>&1; then
          echo "skillsaw needs uvx (from uv). Install uv or skip content lint." >&2; exit 1
        fi
        # skillsaw@latest so a stale uvx cache cannot pin us to an older linter;
        # keep .skillsaw.yaml `version:` in sync with the latest release.
        bash "{{.ROOT_DIR}}/.taskfiles/scripts/quiet-gate.sh" --mode {{.MODE}} lint:content -- uvx skillsaw@latest lint --strict .

  lint:diagrams:
    desc: Lint every mermaid diagram in the module's own docs
    cmd: node {{.SCRIPTS_DIR}}/lint-mermaid.mjs module/ README.md

  lint:voice:
    desc: 'Flag banned house-voice words and phrases in tracked Markdown. MODE=llm for errors-only.'
    cmds:
      # tests/ and eval/fixtures/ hold deliberate bad prose; vendor/ is third-party text.
      - >-
        git ls-files -z -- '*.md' ':(exclude)tests'
        ':(exclude)eval/fixtures' ':(exclude,glob)**/vendor/**'
        | xargs -0 node "{{.ROOT_DIR}}/.taskfiles/scripts/lint-voice.mjs" --mode {{.MODE}}

  test:unit:
    desc: 'Run node:test unit tests for the docs-organization scripts. MODE=llm for errors-only.'
    cmd: bash "{{.ROOT_DIR}}/.taskfiles/scripts/quiet-gate.sh" --mode {{.MODE}} test:unit -- node --test --test-reporter={{if eq .MODE "llm"}}dot{{else}}spec{{end}} tests/scripts/docs-organization/*.test.mjs

  test:bash:
    desc: 'Run the bash script tests. MODE=llm for errors-only.'
    cmds:
      - bash "{{.ROOT_DIR}}/.taskfiles/scripts/quiet-gate.sh" --mode {{.MODE}} test:bash:check-structure -- bash tests/scripts/docs-organization/check-structure.test.sh
      - bash "{{.ROOT_DIR}}/.taskfiles/scripts/quiet-gate.sh" --mode {{.MODE}} test:bash:swap-palette -- bash tests/scripts/docs-organization/swap-palette.test.sh
      - bash "{{.ROOT_DIR}}/.taskfiles/scripts/quiet-gate.sh" --mode {{.MODE}} test:bash:adr-index -- bash tests/scripts/adr/adr-index.test.sh

  test:gates:
    desc: 'Run the bats suites covering the shared lint and verify scripts. MODE=llm for errors-only.'
    preconditions:
      # tests/*.bats call bats_require_minimum_version, which bats added in 1.7.0.
      - sh: |
          command -v bats >/dev/null || exit 1
          v=$(bats --version | sed 's/^Bats //')
          major=${v%%.*}
          rest=${v#*.}
          minor=${rest%%.*}
          [ "$major" -gt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -ge 7 ]; }
        msg: 'bats-core >= 1.7.0 is required. Install it: https://bats-core.readthedocs.io/'
      # verify-oracle.bats drives the real lola binary. Presence only: the
      # oracle owns the >=0.5.0 floor and reports it, so the version is not
      # duplicated here where it would rot out of sync. Beware that a second,
      # older lola under /usr/local/bin outranks ~/.local/bin on any PATH that
      # does not prepend it, which is how this surfaced.
      - sh: command -v lola
        msg: 'lola is required by tests/verify-oracle.bats. Install it: uv tool install --force git+https://github.com/LobsterTrap/lola@v0.7.0'
    cmd: bash "{{.ROOT_DIR}}/.taskfiles/scripts/quiet-gate.sh" --mode {{.MODE}} test:gates -- bats tests/lint-structure.bats tests/lint-quoted-paths.bats tests/verify-oracle.bats tests/quiet-gate.bats tests/module-policy.bats tests/lint-voice.bats

  test:install:
    desc: 'Sandboxed install verify across both scopes and both assistants. MODE=llm for errors-only.'
    cmds:
      - for: {var: MATRIX, split: ' '}
        cmd: |
          set -- $(echo "{{.ITEM}}" | tr ':' ' ')
          bash "{{.ROOT_DIR}}/.taskfiles/scripts/verify-lola-module.sh" \
            --module . --name {{.MODULE}} --assistant "$1" --scope "$2" --mode {{.MODE}}
    vars:
      MATRIX: 'claude-code:user claude-code:project opencode:user opencode:project'

  test:e2e:
    desc: 'Run the end-to-end Venom suite. MODE=llm for errors-only.'
    vars:
      REPO_ROOT:
        sh: pwd
    cmds:
      - mkdir -p .test-output
      - bash "{{.ROOT_DIR}}/.taskfiles/scripts/quiet-gate.sh" --mode {{.MODE}} test:e2e -- venom run tests/e2e/docs-discipline.venom.yml --output-dir=.test-output --var="WORKDIR={{.REPO_ROOT}}"

  test:diagrams:
    desc: Lint and render every mermaid fixture under tests/diagrams/ (light + dark, output in .test-output/diagrams/)
    cmds:
      - mkdir -p .test-output/diagrams
      # Record-only: several fixture diagram types are outside merval's grammar,
      # so findings (exit 1) are expected and saved; an internal error (exit 2) fails.
      - node {{.SCRIPTS_DIR}}/lint-mermaid.mjs --json tests/diagrams/ > .test-output/diagrams/lint.json || [ $? -eq 1 ]
      - bash {{.ROOT_DIR}}/.taskfiles/scripts/render-diagrams.sh {{.ROOT_DIR}}/tests/diagrams {{.ROOT_DIR}}/.test-output/diagrams {{.ROOT_DIR}}/module/skills/docs-organization/reference/palettes/er-overrides.css
      - cat .test-output/diagrams/manifest.txt

  test:
    desc: Run every test suite
    cmds:
      - task: test:unit
      - task: test:bash
      - task: test:gates
      - task: test:install
      - task: test:e2e

  check:
    desc: Run all quality gates (structural lint + content lint + diagrams + voice lint + tests)
    cmds:
      - task: lint
      - task: lint:content
      - task: lint:diagrams
      - task: lint:voice
      - task: test

  cleanroom:build:
    desc: Build the UBI10 cleanroom image (podman preferred, docker fallback)
    preconditions:
      - sh: '[ -n "{{.CONTAINER_ENGINE}}" ]'
        msg: 'No container engine found. Install podman (preferred) or docker.'
    cmds:
      - 'echo "Using container engine: {{.CONTAINER_ENGINE}}"'
      - '{{.CONTAINER_ENGINE}} build -t {{.IMAGE}} -f Containerfile .'

  cleanroom:
    desc: Build, then install-verify inside a fresh container at both scopes
    deps: [cleanroom:build]
    cmds:
      - |
        {{.CONTAINER_ENGINE}} run --rm -v "$PWD:/work:ro,Z" {{.IMAGE}} -c '
          set -e
          cp -R /work /tmp/mod && cd /tmp/mod
          bash .taskfiles/scripts/verify-lola-module.sh --module . --name {{.MODULE}} --scope user --mode {{.MODE}}
          bash .taskfiles/scripts/verify-lola-module.sh --module . --name {{.MODULE}} --scope project --mode {{.MODE}}
        '

  render:
    desc: 'Render one .mmd to PNG on light + dark backgrounds. Usage: task render -- path/to/diagram.mmd'
    cmds:
      - mkdir -p .test-output/render
      - mmdc -i {{.CLI_ARGS}} -o .test-output/render/{{base .CLI_ARGS | replace ".mmd" ""}}.light.png -b white --cssFile {{.SCRIPTS_DIR}}/../reference/palettes/er-overrides.css --quiet
      - mmdc -i {{.CLI_ARGS}} -o .test-output/render/{{base .CLI_ARGS | replace ".mmd" ""}}.dark.png  -b "#1e1e1e" --cssFile {{.SCRIPTS_DIR}}/../reference/palettes/er-overrides.css --quiet
      - 'echo "Rendered to .test-output/render/"'

  palette:
    desc: 'Swap the palette on an existing .mmd, or the mermaid fences of a .md. Usage: task palette -- [--block N] <solar|federation|citrus|parchment> path/to/file. Writes to stdout.'
    cmd: bash {{.ROOT_DIR}}/{{.SCRIPTS_DIR}}/swap-palette.sh {{.CLI_ARGS}}

  clean:
    desc: Remove derived state — test output and the build toolchain. Never touches vendor/.
    cmds:
      # vendor/ is committed source of record that ships to users, not scratch.
      # `task vendor` regenerates it deliberately; clean must not remove it.
      - rm -rf .test-output
      - rm -rf {{.TOOLCHAIN_DIR}}/node_modules
